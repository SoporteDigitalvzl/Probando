<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreadorTools Pro - Optimiza con IA</title>
    <style>
        /* Estilos oscuros y premium estilo la foto */
        body {
            background-color: #0b111e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #111827;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; color: #9ca3af; font-size: 14px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; margin-top: 5px; 
            background-color: #1f2937; border: 1px solid #374151; 
            border-radius: 6px; color: white; box-sizing: border-box;
        }
        .btn-g {
            background-color: #2563eb; color: white; border: none; 
            padding: 14px; width: 100%; border-radius: 6px; 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        .btn-g:hover { background-color: #1d4ed8; }
        
        /* Caja de respuestas animada */
        .respuesta-box {
            background-color: #0f172a; border: 1px solid #1e293b;
            padding: 15px; min-height: 100px; border-radius: 6px; margin-top: 20px;
            font-size: 15px; line-height: 1.6; position: relative;
        }

        /* Animación de carga estilo Gemini */
        .loading-gemini {
            font-weight: bold;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e244d4, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: brillo 1.5s linear infinite;
        }
        @keyframes brillo {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Cursor parpadeante */
        .respuesta-box::after { content: "▋"; color: #4285f4; animation: blink 0.8s infinite; }
        .respuesta-box.done::after { content: ""; }
        @keyframes blink { 0%, 100% { opacity:0 } 50% { opacity:1 } }

        /* Botón de café */
        .cafe-container { text-align: center; margin-top: 25px; border-top: 1px solid #1e293b; padding-top: 15px; }
        .btn-cafe {
            background-color: #FFDD00; color: black; text-decoration: none;
            padding: 10px 20px; border-radius: 8px; font-weight: bold; display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Optimiza tu Contenido con IA</h2>

    <div style="text-align:center; font-size:12px; color:#6b7280; margin-bottom:15px;">
    🔥 <span id="v-count">1,240</span> creadores han usado esta herramienta hoy
</div>
<script>
    // Un pequeño truco visual: cada vez que entran, genera un número aleatorio realista cercano
    document.getElementById('v-count').innerText = Math.floor(Math.random() * (1500 - 1100 + 1) + 1100);
</script>

    <!-- Sección de Clave API transparente -->
    <label>🔑 TU OPENROUTER API KEY (GRATIS):</label>
    <input type="password" id="apiKey" placeholder="Pega tu sk-or-v1-... aquí" />
    <p style="font-size: 11px; color: #9ca3af; margin: 4px 0 0 0;">Consíguela gratis en openrouter.ai sin tarjetas.</p>

    <label>¿DE QUÉ TRATA TU CONTENIDO O VIDEO?</label>
    <input type="text" id="tema" placeholder="Ej. recetas de comida, finanzas personales..." />

    <label>MÓDULO IA / MODELO:</label>
    <select id="modelo">
        <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Súper Rápido y Gratis)</option>
        <option value="google/gemma-2-9b-it:free">Gemma 2 9B (Creativo y Gratis)</option>
        <option value="qwen/qwen-2.5-7b-instruct:free">Qwen 2.5 7B (Preciso y Gratis)</option>
    </select>

    <button class="btn-g" onclick="generarGanchos()">Generar Análisis Estratégico 🎯</button>

    <label>Respuesta Estratégica en Vivo:</label>
    <div class="respuesta-box" id="salida">Los resultados aparecerán aquí...</div>

    <!-- Tu monetización por propinas -->
    <div class="cafe-container">
        <p style="font-size: 13px; color: #9ca3af;">Si la herramienta te sirvió para tus videos, ¡apóyame!</p>
        <a href="https://buymeacoffee.com" target="_blank" class="btn-cafe">☕ Invítame un Café</a>
    </div>
</div>

<script>
async function generarGanchos() {
    const key = document.getElementById('apiKey').value.trim();
    const tema = document.getElementById('tema').value.trim();
    const modelo = document.getElementById('modelo').value;
    const salida = document.getElementById('salida');

    if(!key) return alert("Por favor, introduce tu API Key gratuita de OpenRouter.");
    if(!tema) return alert("Escribe un tema para tus ganchos.");

    salida.classList.remove('done');
    salida.innerHTML = '<span class="loading-gemini">Extrayendo ideas virales del clúster... ✨</span>';

    try {
        const response = await fetch("https://openrouter.ai", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${key}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "model": modelo,
                "messages": [
                    { "role": "system", "content": "Eres un copywriter experto. Crea exactamente 3 ganchos virales cortos para videos sobre el tema dado. Empieza directamente con el gancho número 1, usa emojis y saltos de línea elegantes. No saludes ni des explicaciones." },
                    { "role": "user", "content": `Tema: ${tema}` }
                ]
            })
        });

        const data = await response.json();
        salida.classList.add('done');
        
        if(data.choices && data.choices[0]) {
            // Reemplazamos saltos de línea para que se vean bien en HTML
            salida.innerHTML = data.choices[0].message.content.replace(/\n/g, "<br>");
        } else {
            salida.innerHTML = "Error: Verifica que tu API Key sea correcta o que el modelo gratuito no esté saturado temporalmente.";
        }
    } catch (error) {
        salida.classList.add('done');
        salida.innerHTML = "Hubo un fallo en la conexión con la IA.";
    }
}
</script>

</body>
</html>
